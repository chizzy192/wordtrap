<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WordTrap — Pick a room</title>
<meta name="color-scheme" content="light dark" />
<script>
(function () {
  var q = new URLSearchParams(location.search).get("theme");
  var t = q === "dark" || q === "light" ? q : null;
  if (!t) { try { t = localStorage.getItem("wt.theme"); } catch (e) {} }
  if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root, :root[data-theme="light"] { --board:#FFFDF7; --text:#14121A; --soft:#4A4658; --sheet:#FFFFFF; --line:#14121A; --hard:#14121A; --red:#FF2E4C; --red-text:#D4183A; --yellow:#FFD60A; --blue:#2D5BFF; --blue-text:#2D5BFF; --ink:#14121A; --dot:rgba(20,18,26,.13); color-scheme: light; }
:root[data-theme="dark"] { --board:#14121A; --text:#FFFDF7; --soft:#B9B4CC; --sheet:#1F1C2B; --line:#FFFDF7; --hard:#2D5BFF; --red:#FF2E4C; --red-text:#FF5C74; --yellow:#FFD60A; --blue:#2D5BFF; --blue-text:#8FA9FF; --ink:#14121A; --dot:rgba(255,253,247,.09); color-scheme: dark; }
:root { --cond:"Barlow Condensed","Arial Narrow",Impact,"Helvetica Neue",Arial,sans-serif; --sans:"Barlow","Helvetica Neue",Arial,sans-serif; --snap:cubic-bezier(.2,1.4,.3,1); }
* { box-sizing:border-box; }
html { background:var(--board); }
body { margin:0; color:var(--text); background:var(--board); background-image:radial-gradient(var(--dot) 1.1px, transparent 1.3px); background-size:14px 14px; font:500 15px/1.45 var(--sans); min-height:100vh; overflow-x:hidden; font-variant-numeric:tabular-nums; }
:focus-visible { outline:3px solid var(--blue); outline-offset:3px; }
.wrap { max-width:1100px; margin:0 auto; padding:0 24px 40px; overflow-x:clip; }
header { display:flex; align-items:center; gap:14px; padding:22px 0 10px; flex-wrap:wrap; }
.wordmark { font:800 30px/1 var(--cond); letter-spacing:-.5px; } .wordmark b { color:var(--red); }
.meta { color:var(--soft); }
#themeBtn { margin-left:auto; width:44px; height:44px; border-radius:50%; border:3px solid var(--line); background:var(--board); color:var(--text); cursor:pointer; display:grid; place-items:center; padding:0; }
#themeBtn svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.5; }
:root[data-theme="dark"] #themeBtn .moon, :root[data-theme="light"] #themeBtn .sun { display:none; }
h2 { font:600 17px/1.2 var(--sans); margin:26px 0 10px; }
.strip { display:inline-block; max-width:100%; margin:18px 0 10px; padding:18px 26px; background:var(--yellow); color:var(--ink); border:4px solid var(--ink); box-shadow:8px 8px 0 var(--hard); transform:rotate(-1deg); transform-origin:left center; }
.strip h1 { font:800 40px/1.05 var(--cond); margin:0; }
.btn { font:600 16px var(--sans); padding:14px 22px; border:3px solid #14121A; background:var(--yellow); color:#14121A; box-shadow:5px 5px 0 var(--hard); cursor:pointer; }
.btn.big { font-size:22px; padding:18px 28px; }
.btn.outline { background:var(--sheet); color:var(--text); border-color:var(--line); font-size:14px; padding:9px 14px; }
.btn:disabled { opacity:.6; cursor:default; }
.btn.pressed, .btn:active { transform:translate(5px,5px); box-shadow:0 0 0 var(--hard); transition:transform .08s steps(2), box-shadow .08s steps(2); }
.quick { display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-top:18px; }
.quick .sub { color:var(--soft); }
.rooms { display:flex; flex-direction:column; gap:12px; }
.room { display:grid; grid-template-columns:1.2fr auto 1fr auto auto; gap:16px; align-items:center; padding:12px 16px; border:3px solid var(--line); background:var(--sheet); }
.room .byte { font:600 22px/1 var(--cond); }
.room .turn { color:var(--soft); white-space:nowrap; }
.fuse { display:flex; align-items:center; gap:10px; min-width:120px; }
.fuse i { display:block; height:12px; width:100px; border:3px solid var(--ink); background:transparent; position:relative; }
.fuse i::before { content:""; position:absolute; left:0; top:0; bottom:0; width:var(--pct,50%); background:var(--red); }
.fuse b { font:800 20px/1 var(--cond); color:var(--red-text); }
.pips { display:flex; gap:6px; }
.pip { width:14px; height:14px; border:2px solid var(--ink); }
.pip.human { background:#14121A; } .pip.bot { background:#B9B4CC; } .pip.open { background:transparent; border-color:var(--line); }
:root[data-theme="dark"] .pip.human { background:#FFFDF7; border-color:#FFFDF7; }
.code { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.code input { font:500 16px var(--sans); background:var(--sheet); color:var(--text); border:3px solid var(--line); padding:10px 12px; width:220px; max-width:100%; text-transform:lowercase; }
.msg { margin-top:12px; color:var(--soft); min-height:1.3em; }
.msg.err { color:var(--red-text); font-weight:600; }
.empty { color:var(--soft); }
@media (max-width:760px) {
  .wrap { padding:0 16px 32px; } .strip h1 { font-size:30px; } .strip { padding:14px 18px; box-shadow:6px 6px 0 var(--hard); }
  .quick .btn.big { width:100%; }
  .room { grid-template-columns:1fr auto; } .room .fuse { grid-column:1/-1; } .room .pips { grid-column:1; } .room .join { grid-column:2; justify-self:end; }
  .code input { width:100%; } .code .btn { width:100%; }
}
@media (prefers-reduced-motion: reduce) { .btn.pressed, .btn:active { transition:none; } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="wordmark">Word<b>Trap</b></div>
  <span class="meta">Byte plays, you plant mines</span>
  <button id="themeBtn" type="button" aria-pressed="false" aria-label="Switch to dark theme" title="Switch theme">
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3a9 9 0 1 0 6 15.5A8 8 0 0 1 15 3z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
  </button>
</header>

<div class="strip"><h1>Pick a room</h1></div>

<div class="quick">
  <button class="btn big" id="quick" type="button">Quick play</button>
  <span class="sub">Join a room with a free seat.</span>
</div>
<div class="msg" id="quickMsg" aria-live="polite"></div>

<h2>Open rooms</h2>
<div class="rooms" id="rooms"><span class="empty">Looking for rooms.</span></div>

<h2>Have a room code?</h2>
<form class="code" id="codeForm">
  <label class="sr" for="code" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Room code</label>
  <input id="code" placeholder="room code" autocomplete="off" spellcheck="false" />
  <button class="btn" type="submit">Join room</button>
</form>
<div class="msg" id="codeMsg" aria-live="polite"></div>
</div>

<script type="module">
// Lobby. Rooms come from GET /api/v1/rooms as [{ code, byte, turn, fuse, fuseTotal, seats: ["human"|"bot"|"open" x4] }].
// Until that endpoint ships the page shows the empty state; ?demo=rooms shows two fixture rooms for design review.
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const DEMO = new URLSearchParams(location.search).get("demo");
const EMPTY = "No rooms are live right now. A room opens when a Byte agent starts a run.";
let rooms = [];

// Quick play picks the first room in this order: a free seat first, then the youngest run (fewest turns played).
const order = (a, b) => (b.seats.includes("open") - a.seats.includes("open")) || (a.turn - b.turn);

async function loadRooms() {
  if (DEMO === "rooms") {
    rooms = [
      { code: "2qzldnnve5qhr", byte: "Oly", turn: 12, fuse: 97, fuseTotal: 180, seats: ["human", "bot", "bot", "open"] },
      { code: "3nnqz5lk8ak3j", byte: "Byte", turn: 31, fuse: 41, fuseTotal: 180, seats: ["human", "human", "bot", "bot"] },
    ];
  } else {
    try {
      const r = await fetch("/api/v1/rooms");
      rooms = r.ok ? await r.json() : [];
      if (!r.ok && r.status !== 404) $("quickMsg").textContent = "The room list didn't load. Try again in a moment.";
    } catch { rooms = []; $("quickMsg").textContent = "The server didn't answer. Try again in a moment."; }
  }
  rooms = [...rooms].sort(order);
  $("rooms").innerHTML = rooms.length ? rooms.map((r) => `
    <div class="room">
      <span class="byte">${esc(r.byte)}</span>
      <span class="turn">Turn ${r.turn}</span>
      <span class="fuse" aria-label="Fuse ${r.fuse} of ${r.fuseTotal}"><i style="--pct:${Math.max(0, Math.round((100 * r.fuse) / r.fuseTotal))}%"></i><b>${r.fuse}</b></span>
      <span class="pips" aria-label="${r.seats.filter((s) => s === "human").length} people, ${r.seats.filter((s) => s === "bot").length} bots, ${r.seats.filter((s) => s === "open").length} open">${r.seats.map((s) => `<span class="pip ${s}"></span>`).join("")}</span>
      <button class="btn outline join" type="button" data-code="${esc(r.code)}">Join</button>
    </div>`).join("") : `<span class="empty">${EMPTY}</span>`;
}

// Joining lands on the "Pick a side" page for that room.
function go(code) { location.href = `/side/${encodeURIComponent(code)}${location.search.includes("theme=") ? "?" + new URLSearchParams({ theme: new URLSearchParams(location.search).get("theme") }) : ""}`; }

$("quick").onclick = async () => {
  const b = $("quick"); b.classList.add("pressed"); b.disabled = true; const label = b.textContent; b.textContent = "Finding a room";
  $("quickMsg").className = "msg"; $("quickMsg").textContent = "";
  try {
    let code = null;
    if (DEMO !== "rooms") {
      const r = await fetch("/api/v1/rooms/quick", { method: "POST" });
      if (r.ok) code = (await r.json()).code;
    }
    if (!code) { const pick = rooms.find((x) => x.seats.includes("open")); code = pick?.code ?? null; }
    if (code) return go(code);
    $("quickMsg").className = "msg err";
    $("quickMsg").textContent = rooms.length ? "Every room is full right now. Open one by code to watch, or wait for a seat." : EMPTY;
  } catch { $("quickMsg").className = "msg err"; $("quickMsg").textContent = "The server didn't answer. Try again in a moment."; }
  finally { b.classList.remove("pressed"); b.disabled = false; b.textContent = label; }
};
$("rooms").addEventListener("click", (e) => { const b = e.target.closest("button[data-code]"); if (b) go(b.dataset.code); });
$("codeForm").onsubmit = async (e) => {
  e.preventDefault();
  const code = $("code").value.trim().toLowerCase();
  $("codeMsg").className = "msg";
  if (!code) { $("codeMsg").className = "msg err"; $("codeMsg").textContent = "Type the room code from the link you were given."; return; }
  try {
    const r = await fetch(`/runs/${encodeURIComponent(code)}/spectate`);
    if (r.status === 404) { $("codeMsg").className = "msg err"; $("codeMsg").textContent = "No room has that code. Check the link, or try quick play."; return; }
    const room = rooms.find((x) => x.code === code);
    if (room && !room.seats.includes("open")) { $("codeMsg").textContent = "That room is full. You can still watch and back Byte."; }
    go(code);
  } catch { $("codeMsg").className = "msg err"; $("codeMsg").textContent = "The server didn't answer. Try again in a moment."; }
};

function syncThemeButton() {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  $("themeBtn").setAttribute("aria-pressed", String(dark));
  $("themeBtn").setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
}
$("themeBtn").onclick = () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("wt.theme", next); } catch (e) { /* private mode */ }
  syncThemeButton();
};
syncThemeButton();
loadRooms();
setInterval(loadRooms, 5000);
</script>
</body>
</html>
